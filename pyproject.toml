[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calcprop-qbank"
version = "0.9.0"
description = "Generador de bancos de preguntas de opción múltiple (AMC y Moodle) con cálculo proposicional"
authors = [
    {name = "Marcos Bujosa", email = "mbujosab@ucm.es"},
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "calcprop>=0.2.0",
    "numpy",
]

keywords = ["question bank", "multiple choice", "AMC", "Moodle", "propositional calculus", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
qbank-lint = "qbank._lint:main"
qbank-init = "qbank._plantilla:main"

[project.optional-dependencies]
jupyter = ["ipywidgets>=8"]

[project.urls]
Homepage      = "https://mbujosab.github.io/calcprop-qbank/"
Source        = "https://github.com/mbujosab/calcprop-qbank"
Documentation = "https://mbujosab.github.io/calcprop-qbank/"
Binder        = "https://mybinder.org/v2/gh/mbujosab/calcprop-qbank/main?urlpath=lab/tree/Tutorial.ipynb"
Changelog     = "https://github.com/mbujosab/calcprop-qbank/releases"
Issues        = "https://github.com/mbujosab/calcprop-qbank/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qbank"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qbank",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
